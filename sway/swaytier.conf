# swaytier key bindings. Include this after $mod is set:
#   include ~/.config/sway/swaytier.conf

set $swaytier ~/.local/bin/swaytier

# Workspaces of the active project
bindsym $mod+1 exec $swaytier ws 1
bindsym $mod+2 exec $swaytier ws 2
bindsym $mod+3 exec $swaytier ws 3
bindsym $mod+4 exec $swaytier ws 4
bindsym $mod+5 exec $swaytier ws 5
bindsym $mod+6 exec $swaytier ws 6
bindsym $mod+7 exec $swaytier ws 7
bindsym $mod+8 exec $swaytier ws 8
bindsym $mod+9 exec $swaytier ws 9
bindsym $mod+0 exec $swaytier ws 10

bindsym $mod+Shift+1 exec $swaytier move 1
bindsym $mod+Shift+2 exec $swaytier move 2
bindsym $mod+Shift+3 exec $swaytier move 3
bindsym $mod+Shift+4 exec $swaytier move 4
bindsym $mod+Shift+5 exec $swaytier move 5
bindsym $mod+Shift+6 exec $swaytier move 6
bindsym $mod+Shift+7 exec $swaytier move 7
bindsym $mod+Shift+8 exec $swaytier move 8
bindsym $mod+Shift+9 exec $swaytier move 9
bindsym $mod+Shift+0 exec $swaytier move 10

# Projects
bindsym $mod+p exec $swaytier project
bindsym $mod+Tab exec $swaytier toggle
bindsym $mod+m exec $swaytier home
bindsym $mod+Shift+p exec $swaytier send
bindsym $mod+Control+p exec $swaytier assign

# Find anything, name the current workspace
bindsym $mod+g exec $swaytier menu
bindsym $mod+n exec $swaytier label

exec $swaytier adopt
